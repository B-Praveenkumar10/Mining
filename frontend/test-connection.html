<!DOCTYPE html>
<html>
<head>
    <title>Backend Connection Test</title>
</head>
<body>
    <h1>Backend Connection Test</h1>
    <button onclick="testConnection()">Test Login</button>
    <div id="result"></div>

    <script>
        async function testConnection() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Testing...';
            
            try {
                const response = await fetch('http://localhost:8000/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: 'operator1',
                        password: 'password123'
                    }),
                });

                if (response.ok) {
                    const data = await response.json();
                    resultDiv.innerHTML = `<p style="color: green;">SUCCESS: ${JSON.stringify(data, null, 2)}</p>`;
                } else {
                    const error = await response.json();
                    resultDiv.innerHTML = `<p style="color: red;">ERROR: ${JSON.stringify(error, null, 2)}</p>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<p style="color: red;">FETCH ERROR: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
